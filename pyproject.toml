[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homebrewery-pdf-converter"
version = "0.1.0"
description = "Translate authorized PDF content into Homebrewery V3 Markdown in resumable batches."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
